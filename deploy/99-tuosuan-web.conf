# Tuosuan Cloud website: conservative tuning for a 2 vCPU / 4 GiB VM.
# Install as /etc/sysctl.d/99-tuosuan-web.conf, then run: sysctl --system

# Allow short connection bursts without allocating memory up front.
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 4096
net.ipv4.tcp_max_syn_backlog = 4096

# Keep the kernel's on-demand SYN flood protection enabled.
net.ipv4.tcp_syncookies = 1

# Release orphaned FIN-WAIT-2 sockets sooner. This does not shorten active sessions.
net.ipv4.tcp_fin_timeout = 30

# Detect dead idle peers without creating aggressive keepalive traffic.
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 60
net.ipv4.tcp_keepalive_probes = 5

# Prefer application/file cache memory; swap remains available for emergencies.
vm.swappiness = 10
vm.vfs_cache_pressure = 50

# Ample global descriptor ceiling for Nginx and system services.
fs.file-max = 262144
